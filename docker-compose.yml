services:
  postgres:
    image: postgres:15
    container_name: plaza-postgres
    environment:
      POSTGRES_USER: plaza_user
      POSTGRES_PASSWORD: plaza_pass
      POSTGRES_DB: plazasales
    ports:
      - "5433:5432"
    networks:
      - plaza-network
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plaza_user"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: plaza-redis
    ports:
      - "6380:6379"
    networks:
      - plaza-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: iadityatharu/plaza-sales:latest
    pull_policy: always
    container_name: plaza-backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "5436:5436"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - plaza-network
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect({ host: '127.0.0.1', port: 5436 }).once('connect', () => process.exit(0)).once('error', () => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  plaza-network:
    driver: bridge

volumes:
  pgdata:
